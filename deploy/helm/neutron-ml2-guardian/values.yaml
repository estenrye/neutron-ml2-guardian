# Default values for neutron-ml2-guardian.
# See docs/specs/2026-09-13-neutron-ml2-guardian-design.md for the full
# design this chart implements.

image:
  repository: docker.io/estenrye/neutron-ml2-guardian
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# The guardian runs in its own namespace (wherever this release is
# installed) but reads/patches resources in targetNamespace via a
# cross-namespace Role+RoleBinding -- see templates/role.yaml. Keeping the
# guardian's own RBAC footprint auditable separately from the target
# namespace's own service accounts is the point; see the design doc's
# "Deployment shape" section.
targetNamespace: pcd

# The Helm release and Deployment this guardian keeps repaired. Not
# hardcoded anywhere in the controller itself -- these are real config, per
# the design doc's insistence that "pcd"/"neutron"/"neutron-server" are this
# cluster's naming, not Neutron/PCD constants.
helmReleaseName: neutron
deploymentName: neutron-server

reconcileIntervalSecs: 300

# Safe by default: the guardian logs what a repair *would* do (the computed
# mechanism_drivers value, the intended patch, the wheel-cache refresh) but
# never actually patches the neutron-etc Secret, patches the Deployment, or
# creates a Job while this is true. It can rewrite neutron-server's rendered
# config and pod spec directly, which is real power -- review a dry-run
# cycle's logs before deliberately setting this to `false`.
dryRun: true

# Shared ReadWriteMany PVC for the wheel cache. Defaults to "pcd-sc" --
# Platform9 PCD's own default StorageClass (kubevirt.io.hostpath-provisioner)
# -- deliberately, even though hostpath-backed storage isn't genuinely RWX
# (it provisions a directory on a single node's local disk, not real shared
# storage). This works in practice for PCD Community Edition, which is
# typically single-node, and is likely to be correctly configured on-prem
# installs too; it will not work on a real multi-node cluster, where this
# must be overridden to an actual RWX-capable class (NFS-backed, etc.).
# Still a plain overridable value -- override via --set/-f for any
# environment where "pcd-sc" isn't right.
wheelcache:
  pvcName: neutron-ml2-wheelcache
  storageClassName: "pcd-sc"
  size: 512Mi

# The drivers this guardian keeps present. Each entry:
#   name:                        the mechanism_drivers/stevedore name
#   pipPackage:                  pip-installable package spec
#   importModule:                top-level Python module to test-import
#   extraConfigSecretData:       (optional) opaque INI content this driver
#                                needs, written verbatim into a per-driver
#                                Secret and mounted as an extra
#                                --config-file. Never parsed by the guardian.
#   soleDriver:                  (optional, default false) set only for a
#                                driver that cannot coexist with other
#                                soleDriver-flagged entries.
#
# See docs/specs/2026-09-13-neutron-ml2-guardian-design.md's "Generalizing"
# section. Empty by default -- a real deployment of this chart must set at
# least one driver via its own values file/overlay.
ml2Drivers: []
# Example, using networking-unifi's real [unifi] config schema (verified
# 2026-09-14 against unifi_ml2_driver/config.py -- apikey is preferred over
# username/password when both are set). host/site below are the real,
# verified values for pcd.rye.ninja's UDM-SE (confirmed reachable and
# authenticating via its Network Integration API -- GET
# /proxy/network/integration/v1/sites returned HTTP 200 with one site,
# internalReference "default" -- from both the PCD host and from inside a
# pod's own network namespace in this cluster, 2026-09-14). apikey is never
# a real value here -- see values.secrets.yaml convention in .gitignore.
# ml2Drivers:
#   - name: unifi
#     pipPackage: unifi-ml2-driver
#     importModule: unifi_ml2_driver
#     extraConfigSecretData: |
#       [unifi]
#       host = 10.45.0.1
#       apikey = REPLACE_ME
#       site = default

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# OTLP export is opt-in, same convention as pdns4-shim -- unset means stdout
# JSON logging only.
otel:
  exporterEndpoint: ""

logLevel: info
