{{/*
Lives in .Values.targetNamespace (e.g. "pcd"), not .Release.Namespace --
this is a cross-namespace resource on purpose. See
docs/specs/2026-09-13-neutron-ml2-guardian-design.md: PVCs are
namespace-scoped, and both the injected initContainer on neutron-server and
the wheel-download Job need to mount this by claimName within *their*
namespace (pcd), which the guardian's own namespace can't provide. The
guardian itself never mounts this PVC directly -- see wheelcache.rs's
module doc comment for how it reads back download results instead (Job pod
logs, not a shared filesystem).
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.wheelcache.pvcName }}
  namespace: {{ .Values.targetNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteMany
  {{- with .Values.wheelcache.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.wheelcache.size }}
