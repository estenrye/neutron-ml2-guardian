{{/*
Lives in .Values.targetNamespace, not .Release.Namespace -- a cross-
namespace Role bound (see rolebinding.yaml) to this release's ServiceAccount
from the guardian's own namespace. Narrower than an earlier draft of this
chart: the original design needed broad access across whatever resource
kinds the `neutron` chart renders, to support running `helm upgrade` for
the mechanism_drivers change. That approach turned out to be infeasible
(see docs/specs/2026-09-13-neutron-ml2-guardian-design.md and
src/reconcile.rs's module doc comment: reconstructing the chart from its
own Helm release data can't recover subchart content) and was replaced
with patching the neutron-etc Secret directly -- so this Role only needs
access to specific, named resources, not the chart's full surface. Still
worth reviewing deliberately: it can rewrite neutron-server's rendered
config and pod spec directly.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-target
  namespace: {{ .Values.targetNamespace }}
rules:
  # Read the guarded Deployment and patch its pod spec (initContainer +
  # volumes + PYTHONPATH injection + the restart-forcing annotation).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ .Values.deploymentName | quote }}]
    verbs: ["get", "patch"]

  # Find a Ready pod for the layered present-check, and exec into it.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # neutron-etc (the Secret holding every rendered Neutron config file,
  # including ml2_conf.ini -- patched directly, see reconcile.rs) and the
  # per-driver extra-config Secrets this chart creates. "create" is needed
  # alongside "patch" because server-side apply performs an implicit create
  # the first time a per-driver Secret is written.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch", "create"]

  # neutron-bin (the ConfigMap holding neutron-server.sh, the startup
  # script neutron-server is actually launched with) -- patched once to add
  # a --config-dir flag when a driver needs extraConfigSecretData, see
  # reconcile::add_config_dir_flag.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["neutron-bin"]
    verbs: ["get", "patch"]

  # The wheel-download Job, created fresh on each cache refresh, and its
  # pod's logs (read via pods/log above) for the filename list it produced.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
