{{/*
Lives in .Values.targetNamespace, not .Release.Namespace -- a cross-
namespace Role bound (see rolebinding.yaml) to this release's ServiceAccount
from the guardian's own namespace. This is a meaningfully powerful grant --
see docs/specs/2026-09-13-neutron-ml2-guardian-design.md's "Safety rails"
section: it is effectively "can run `helm upgrade neutron` and rewrite its
Deployment's pod spec." Review it deliberately, don't rubber-stamp it.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-target
  namespace: {{ .Values.targetNamespace }}
rules:
  # Read the guarded Deployment and patch its pod spec (initContainer +
  # volumes + PYTHONPATH injection).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ .Values.deploymentName | quote }}]
    verbs: ["get", "patch"]

  # Find a Ready pod for the layered present-check, and exec into it.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Read the neutron Helm release's stored values/chart (Helm release data
  # is stored as Secrets named sh.helm.release.v1.<release>.v<revision>),
  # and read/write per-driver extra-config Secrets this chart itself
  # manages.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]

  # The wheel-download Job, created fresh on each cache refresh.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]

  # The shared wheelcache PVC (see pvc.yaml) -- read-only from the
  # guardian's own perspective (it doesn't mount this itself, but Helm's
  # patch/apply flow for `helm upgrade`-driven resources needs get access).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]

  # ConfigMaps/other resource kinds the `neutron` chart's own templates
  # render, needed for the `helm upgrade --set mechanism_drivers=...` repair
  # step to succeed (Helm computes and applies a patch across whatever the
  # chart defines -- this must cover its full resource surface, not just
  # the Deployment).
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
