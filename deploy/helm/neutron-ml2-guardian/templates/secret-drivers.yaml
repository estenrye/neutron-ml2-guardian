{{/*
Mounted at DRIVERS_CONFIG_PATH (see src/config.rs's default,
/etc/neutron-ml2-guardian/drivers.yaml). This is a Secret, not a ConfigMap,
because a driver's extraConfigSecretData commonly embeds real credentials
(a UniFi controller API key, switch SSH passwords, ...) directly in this
chart's own values -- see values.yaml's example. The guardian reads this
file at startup and, per driver, writes extraConfigSecretData verbatim into
its own separate per-driver Secret at runtime
(k8s::write_driver_config_secret in the target namespace); this Secret here
is just how that content reaches the guardian process in the first place.
Operators supplying real credentials via a values file should keep that
file out of plaintext version control (e.g. via `helm upgrade -f
secrets.values.yaml` from an untracked file, or a secrets-management layer)
-- this chart does not solve that problem for you.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-drivers
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  drivers.yaml: |
    ml2Drivers:
{{- range .Values.ml2Drivers }}
      - name: {{ .name | quote }}
        pipPackage: {{ .pipPackage | quote }}
        importModule: {{ .importModule | quote }}
        soleDriver: {{ .soleDriver | default false }}
{{- if .extraConfigSecretData }}
        extraConfigSecretData: |
{{ .extraConfigSecretData | indent 10 }}
{{- end }}
{{- end }}
