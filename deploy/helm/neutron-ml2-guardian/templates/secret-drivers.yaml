{{/*
Mounted at DRIVERS_CONFIG_PATH (see src/config.rs's default,
/etc/neutron-ml2-guardian/drivers.yaml). This is a Secret, not a ConfigMap,
because extraConfigSecretData (when used -- see below) commonly embeds real
credentials directly in this chart's own values.

Two ways to supply a driver's extra Neutron config, mutually exclusive per
driver (the guardian refuses to start if both are set for the same one):
- extraConfigSecretData: inlined here, written verbatim by the guardian
  into its own managed per-driver Secret at runtime
  (k8s::write_driver_config_secret). Operators supplying real credentials
  this way should keep the values file out of plaintext version control
  (e.g. `helm upgrade -f secrets.values.yaml` from an untracked file) --
  this chart does not solve that problem for you.
- extraConfigSecretRef: the name of an *existing* Secret (created
  out-of-band -- kubectl create secret, an external-secrets operator, etc.)
  that the guardian only ever references by name and mounts directly,
  never reads or writes. Nothing about the driver's actual credentials
  passes through this chart's values or release storage at all -- prefer
  this whenever the config contains anything sensitive. The referenced
  Secret must contain a key named "<driver name>.ini" (see
  DriverSpec::extra_config_secret_name's doc comment).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-drivers
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  drivers.yaml: |
    ml2Drivers:
{{- range .Values.ml2Drivers }}
      - name: {{ .name | quote }}
        pipPackage: {{ .pipPackage | quote }}
        importModule: {{ .importModule | quote }}
        soleDriver: {{ .soleDriver | default false }}
{{- if .extraConfigSecretRef }}
        extraConfigSecretRef: {{ .extraConfigSecretRef | quote }}
{{- else if .extraConfigSecretData }}
        extraConfigSecretData: |
{{ .extraConfigSecretData | indent 10 }}
{{- end }}
{{- end }}
